<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Segurança: o app só carrega os próprios arquivos e não pode fazer nenhuma conexão de rede. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cofre">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Cofre</title>
</head>
<body>
  <div id="app"><div class="lock"><div class="spinner"></div></div></div>
  <div id="sheet-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="calc.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
